name: Native transport and generated SDKs
on: [push, pull_request]
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --workspace --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p ethersync-bindings --locked
      - name: Package native SDK
        run: |
          ETHERSYNC_SDK_ARTIFACTS="$PWD/target/debug" ETHERSYNC_SDK_OUT="$PWD/dist" cargo build -p ethersync-sdk
          cmake -S "dist/ethersync-native-${{ matrix.target }}" -B target/sdk-consumer
          cmake --build target/sdk-consumer --config Debug
          ctest --test-dir target/sdk-consumer -C Debug --output-on-failure
          cargo check --manifest-path "dist/ethersync-native-${{ matrix.target }}/source/Cargo.toml" -p ethersync-bindings --locked
      - name: C# native consumer
        run: dotnet run --project "dist/ethersync-native-${{ matrix.target }}/csharp/Smoke" -c Release
      - name: Swift native consumer
        if: runner.os == 'macOS'
        run: |
          GEN=target/debug/ethersync-generated/native
          swiftc -D ETHERSYNC_NATIVE -import-objc-header "$GEN/BridgingHeader.h" "$GEN/SwiftBridgeCore.swift" "$GEN/Ethersync.swift" clients/bindings/examples/main.swift target/debug/libethersync_bindings.a -Xlinker -lc++ -framework Security -framework SystemConfiguration -framework CoreFoundation -o target/swift-smoke
          target/swift-smoke
          swift run --package-path "dist/ethersync-native-${{ matrix.target }}" EthersyncSmoke
          ETHERSYNC_SDK_SWIFT_DYLIB=1 ETHERSYNC_SDK_ARTIFACTS="$PWD/target/debug" ETHERSYNC_SDK_OUT="$PWD/dist" cargo build -p ethersync-sdk
          "dist/ethersync-native-${{ matrix.target }}/swift-dylib/EthersyncSmoke"
      - name: Core-only SDK
        run: |
          cargo build -p ethersync-bindings --no-default-features --features c,cpp,swift,csharp --target-dir target/core --locked
          ETHERSYNC_SDK_VARIANT=core ETHERSYNC_SDK_ARTIFACTS="$PWD/target/core/debug" ETHERSYNC_SDK_OUT="$PWD/dist" cargo build -p ethersync-sdk
          cmake -S "dist/ethersync-core-${{ matrix.target }}" -B target/core-consumer
          cmake --build target/core-consumer --config Debug
          ctest --test-dir target/core-consumer -C Debug --output-on-failure
      - name: C# core consumer
        run: dotnet run --project "dist/ethersync-core-${{ matrix.target }}/csharp/Smoke" -c Release
      - name: Swift core consumer
        if: runner.os == 'macOS'
        run: swift run --package-path "dist/ethersync-core-${{ matrix.target }}" EthersyncSmoke
      - uses: actions/upload-artifact@v4
        with:
          name: ethersync-sdk-${{ matrix.target }}
          path: dist/
