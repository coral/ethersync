[package]
name = "tidkod-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = ["native", "c", "cpp", "swift", "csharp"]
native = ["dep:tidkod"]
c = []
csharp = ["c"]
cpp = ["c"]
swift = ["dep:swift-bridge"]
[dependencies]
tidkod-protocol = { path = "../../protocol" }
tidkod = { path = "../../native", optional = true }
swift-bridge = { version = "0.1.59", optional = true }
[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
cbindgen = { version = "0.29.4", default-features = false }
swift-bridge-build = "0.1.59"
csbindgen = "1.9.8"

[package.metadata.release]
publish = false
