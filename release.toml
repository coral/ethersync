# Install the tested tool: cargo install cargo-release --version 1.1.6 --locked
allow-branch = ["master"]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "Release {{version}}"
tag-name = "v{{version}}"
tag-message = "Tidkod {{version}}"
tag = true
push = true
push-remote = "origin"
# Only tidkod-protocol and tidkod are publishable; client crates opt out.
publish = true
verify = true
dependent-version = "upgrade"
