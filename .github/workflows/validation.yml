name: Source validation
on:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package -p ethersync-protocol --locked
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/smoke_examples.py
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - name: Validate workflows and schema
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/bufbuild/buf/cmd/buf@v1.73.0
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          actionlint
          buf lint
          buf format --diff --exit-code
          buf build -o "$RUNNER_TEMP/ethersync-descriptor.bin"
          python scripts/generate_docs.py --check
  web:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
