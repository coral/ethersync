[package]
name = "ethersync-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ethersync-protocol = { path = "../../protocol" }
wasm-bindgen = "=0.2.128"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

# Native-only measurement fixture; these are not dependencies of the WASM build.
[dev-dependencies]
libethersync = { path = "../../native" }
moq-net = "0.2.22"
moq-native = { version = "0.19.19", default-features = false, features = ["quinn", "ring"] }
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "macros", "net"] }

[package.metadata.release]
publish = false
