[package]
name = "ethersync-bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = ["native", "c", "cpp", "swift", "csharp"]
native = ["dep:ethersync"]
c = []
csharp = ["c"]
cpp = ["dep:cxx"]
swift = ["dep:swift-bridge"]
[dependencies]
ethersync-protocol = { path = "../../protocol" }
ethersync = { path = "../../lib", optional = true }
cxx = { version = "1.0.202", optional = true }
swift-bridge = { version = "0.1.59", optional = true }
[build-dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
cxx-build = "1.0.202"
cbindgen = { version = "0.29.4", default-features = false }
swift-bridge-build = "0.1.59"
csbindgen = "1.9.8"
