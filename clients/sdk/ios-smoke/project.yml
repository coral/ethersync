name: TidkodSmoke
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  Tidkod:
    path: SDK
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGNING_ALLOWED: NO
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: se.tidkod.smoke
targets:
  TidkodSmoke:
    type: application
    platform: iOS
    sources: [App.swift]
    info:
      path: Info.plist
      properties:
        NSBonjourServices: ["_tidkod._udp"]
        NSLocalNetworkUsageDescription: Discover and synchronize timecode with local devices.
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  TidkodSmokeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmokeTests.swift]
    dependencies:
      - target: TidkodSmoke
      - package: Tidkod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.tidkod.smoke.tests
schemes:
  TidkodSmoke:
    build:
      targets:
        TidkodSmoke: all
        TidkodSmokeTests: [test]
    test:
      targets: [TidkodSmokeTests]
